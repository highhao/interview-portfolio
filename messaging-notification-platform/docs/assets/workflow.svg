<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#64748b"/></marker><style>text{font-family:'Segoe UI','Noto Sans TC',sans-serif;fill:#172033}.title{font-size:27px;font-weight:700;fill:#fff}.sub{font-size:15px;fill:#dbeafe}.h{font-size:17px;font-weight:700}.p{font-size:14px;fill:#475569}.edge{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#a)}</style></defs><rect width="1200" height="520" rx="24" fill="#f5f8fc"/><rect width="1200" height="82" rx="24" fill="#14233b"/><rect y="58" width="1200" height="24" fill="#14233b"/><text x="40" y="45" class="title">即時通訊與通知平台｜狀態更新流程</text><text x="40" y="68" class="sub">訊息寫入、未讀維護、已讀游標與列表快取</text>
<rect x="45" y="150" width="180" height="85" rx="14" fill="#e8f1ff" stroke="#8bb7f0"/><text x="135" y="184" text-anchor="middle" class="h">接收訊息</text><text x="135" y="211" text-anchor="middle" class="p">驗證請求與使用者</text>
<rect x="290" y="150" width="190" height="85" rx="14" fill="#fff" stroke="#94a3b8"/><text x="385" y="184" text-anchor="middle" class="h">儲存訊息</text><text x="385" y="211" text-anchor="middle" class="p">更新會話最後訊息</text>
<rect x="545" y="150" width="190" height="85" rx="14" fill="#fff7e8" stroke="#f4c66b"/><text x="640" y="184" text-anchor="middle" class="h">更新未讀狀態</text><text x="640" y="211" text-anchor="middle" class="p">增加接收者未讀數</text>
<rect x="800" y="150" width="180" height="85" rx="14" fill="#f5efff" stroke="#b99bea"/><text x="890" y="184" text-anchor="middle" class="h">清除列表快取</text><text x="890" y="211" text-anchor="middle" class="p">避免舊會話資料</text>
<rect x="1030" y="150" width="130" height="85" rx="14" fill="#eefbf5" stroke="#7dd3a9"/><text x="1095" y="184" text-anchor="middle" class="h">回傳結果</text><text x="1095" y="211" text-anchor="middle" class="p">通知發送者</text>
<path d="M225 192 H290 M480 192 H545 M735 192 H800 M980 192 H1030" class="edge"/>
<rect x="290" y="330" width="190" height="85" rx="14" fill="#e8f1ff" stroke="#8bb7f0"/><text x="385" y="364" text-anchor="middle" class="h">開啟會話</text><text x="385" y="391" text-anchor="middle" class="p">讀取訊息與游標</text>
<rect x="545" y="330" width="190" height="85" rx="14" fill="#fff7e8" stroke="#f4c66b"/><text x="640" y="364" text-anchor="middle" class="h">標記已讀</text><text x="640" y="391" text-anchor="middle" class="p">推進 read cursor</text>
<rect x="800" y="330" width="180" height="85" rx="14" fill="#f5efff" stroke="#b99bea"/><text x="890" y="364" text-anchor="middle" class="h">重設未讀</text><text x="890" y="391" text-anchor="middle" class="p">使相關快取失效</text>
<path d="M480 372 H545 M735 372 H800" class="edge"/><path d="M1095 235 V285 H385 V330" class="edge"/>
<rect x="45" y="455" width="1115" height="42" rx="11" fill="#e9eef5"/><text x="70" y="482" class="p">關鍵設計：訊息、未讀數、最後訊息與快取失效需保持一致，避免不同列表 API 顯示互相矛盾。</text></svg>
